<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>동화나라 — AI 동화책 생성</title>
  <meta name="description" content="프롬프트 한 줄로 동화책을 만들고, 한국어·영어·일본어 음성으로 들을 수 있는 AI 웹 애플리케이션입니다." />
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register"></script>
</head>
<body>
  <a class="skip-link" href="#project-content">본문으로 이동</a>

  <!-- ============ HERO ============ -->
  <header class="hero">
    <div class="container">
      <h1>동화나라</h1>
      <p class="tagline">프롬프트 한 줄로 만드는 다국어 AI 동화책</p>
    </div>
  </header>

  <main class="container">

    <!-- ============ 데모 카드 ============ -->
    <section class="demo-card" aria-label="동화나라 데모와 바로가기">
      <div class="screenshot-frame">
        <img class="screenshot" src="./pic/donghwanara.png" alt="동화나라 데모 화면" decoding="async" />
      </div>

      <div class="demo-actions">
        <div class="cta">
          <a class="btn btn-primary" href="https://donghwanara.site/" aria-disabled="false" title="Live Demo 열기">
            ▶ Live Site <span class="badge">Ubuntu Server</span>
          </a>

          <a class="btn btn-secondary" href="https://github.com/JongchanJeon/donghwanaraFE" target="_blank" rel="noopener">
            ⌨ Frontend Code on GitHub
          </a>
          <a class="btn btn-secondary" href="https://github.com/JongchanJeon/donghwanaraBE" target="_blank" rel="noopener">
            ⌨ Backend Code on GitHub
          </a>
        </div>

        <div class="project-points" aria-label="프로젝트 핵심 정보">
          <span>React + Spring Boot</span>
          <span>OpenAI gpt-5.4-mini</span>
          <span>Ubuntu + MariaDB</span>
        </div>
      </div>
    </section>

    <!-- ============ 본문 (contents.md 인라인 렌더) ============ -->
    <section id="project-content" class="content">
      <!-- ⬇⬇⬇ 같은 폴더의 contents.md 를 수정하면 자동 반영 ⬇⬇⬇ -->
      <zero-md src="./contents.md" no-shadow></zero-md>
      <!-- ⬆⬆⬆ 같은 폴더의 contents.md 를 수정하면 자동 반영 ⬆⬆⬆ -->
    </section>

    <!-- ============ Giscus 댓글 (8장에서 추가) ============ -->
    <section id="comments" class="comments">
      <h2>동화나라에 의견 남기기</h2>
      <p class="comments-note">
        GitHub 계정으로 로그인하면 댓글이 본인 리포의 GitHub Discussions에 자동 저장됩니다.
      </p>

      <!--
        ⬇⬇⬇ 9주차 SECTION 8 에서 giscus.app 가 자동 생성한 script 코드를 여기에 붙여넣기 ⬇⬇⬇
        교체할 속성:
          - data-repo
          - data-repo-id
          - data-category-id
        나머지 속성은 그대로 두세요.
      -->
      <div class="giscus"></div>
      <!-- <script src="https://giscus.app/client.js"
        data-repo="aprilslab/aiweb2026"
        data-repo-id="R_kgDOSPkZMg"
        data-category="Announcements"
        data-category-id="DIC_kwDOSPkZMs4C78hA"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="ko"
        crossorigin="anonymous"
        async>
      </script> -->
      <script src="https://giscus.app/client.js"
        data-repo="JongchanJeon/aiweb2026-intro"
        data-repo-id="R_kgDOSPzFVA"
        data-category="Announcements"
        data-category-id="DIC_kwDOSPzFVM4C79fW"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="ko"
        crossorigin="anonymous"
        async>
      </script>
      <!-- ⬆⬆⬆ giscus 설정값 교체 ⬆⬆⬆ -->
    </section>
  </main>

  <footer>
    <div class="container">
      <p>
        2026 AI 웹 융합 · 9주차 데모 소개 페이지 ·
        <a href="https://aiweb2026.site">aiweb2026.site</a>
      </p>
    </div>
  </footer>
</body>
</html>
